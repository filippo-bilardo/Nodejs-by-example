<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">Attesa di I/O e thread principale</title>
<desc id="desc">Il thread principale avvia readFile e continua il codice. Il lavoro di lettura avviene tramite il pool di libuv e il sistema operativo. Dopo il completamento, l’event loop esegue la callback quando il thread è disponibile.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#42596a"/></marker></defs>
<rect width="1040" height="560" rx="20" fill="#f4f7fa"/>
<rect x="32" y="30" width="6" height="58" rx="3" fill="#176544"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="54" y="53" font-size="27" fill="#172c3c" font-weight="700" text-anchor="start">Attesa di I/O e thread principale</text>
<text x="54" y="82" font-size="16" fill="#42596a" font-weight="400" text-anchor="start">Esempio: lettura asincrona di un file con una callback</text>
<text x="32" y="132" font-size="16" fill="#176544" font-weight="700" text-anchor="start">THREAD PRINCIPALE · JavaScript</text>
<rect x="32" y="153" width="282" height="106" rx="14" fill="#ffffff" stroke="#cad7df" stroke-width="1.5"/>
<rect x="50" y="172" width="5" height="23" rx="2" fill="#176544"/>
<text x="66" y="191" font-size="20" fill="#176544" font-weight="700" text-anchor="start">Avvia readFile</text>
<text x="52" y="225" font-size="17" fill="#172c3c" font-weight="400" text-anchor="start">Registra la callback</text>
<rect x="378" y="153" width="282" height="106" rx="14" fill="#ffffff" stroke="#cad7df" stroke-width="1.5"/>
<rect x="396" y="172" width="5" height="23" rx="2" fill="#176544"/>
<text x="412" y="191" font-size="20" fill="#176544" font-weight="700" text-anchor="start">Continua</text>
<text x="398" y="225" font-size="17" fill="#172c3c" font-weight="400" text-anchor="start">Esegue il codice sincrono</text>
<rect x="724" y="153" width="284" height="106" rx="14" fill="#ffffff" stroke="#cad7df" stroke-width="1.5"/>
<rect x="742" y="172" width="5" height="23" rx="2" fill="#176544"/>
<text x="758" y="191" font-size="20" fill="#176544" font-weight="700" text-anchor="start">Esegue callback</text>
<text x="744" y="225" font-size="17" fill="#172c3c" font-weight="400" text-anchor="start">Quando il thread è libero</text>
<polyline points="316,206 374,206" fill="none" stroke="#42596a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="662,206 720,206" fill="none" stroke="#42596a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="160" y="320" font-size="16" fill="#2256a0" font-weight="700" text-anchor="start">LETTURA ASINCRONA DEL FILE</text>
<rect x="160" y="341" width="360" height="115" rx="14" fill="#edf3fc" stroke="#cad7df" stroke-width="1.5"/>
<rect x="178" y="360" width="5" height="23" rx="2" fill="#2256a0"/>
<text x="194" y="379" font-size="20" fill="#2256a0" font-weight="700" text-anchor="start">Legge il file</text>
<text x="180" y="413" font-size="17" fill="#172c3c" font-weight="400" text-anchor="start">Pool di libuv + sistema operativo</text>
<polyline points="120,261 120,399 156,399" fill="none" stroke="#42596a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="522,399 866,399 866,263" fill="none" stroke="#42596a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="579" y="382" font-size="18" fill="#2256a0" font-weight="700" text-anchor="start">Completamento</text>
<text x="579" y="426" font-size="16" fill="#42596a" font-weight="400" text-anchor="start">L’event loop coordina la callback.</text>
<text x="32" y="536" font-size="15" fill="#42596a" font-weight="400" text-anchor="start">Schema semplificato: l’I/O di rete usa normalmente meccanismi del sistema operativo, non un thread per socket.</text>
</g>
</svg>
